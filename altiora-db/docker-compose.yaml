services:
  postgres:
    image: docker.io/postgres:16
    container_name: altiora_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      # Scripts que se ejecutan en orden alfabético SOLO la primera vez
      # (cuando el volumen de datos está vacío)
      - ./init_db/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql:ro
      - ./init_db/load_data.sql:/docker-entrypoint-initdb.d/2_load_data.sql:ro
      # CSVs disponibles dentro del contenedor para el \copy
      - ./init_data:/data/csv:ro
      # Volumen persistente de datos (no se borra al bajar el contenedor)
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    container_name: altiora_pgadmin
    build:
          context: ./init_db
          dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${POSTGRES_DB}
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      PG_SERVER_NAME: ${PG_SERVER_NAME}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data:
